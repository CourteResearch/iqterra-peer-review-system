services:
  app:
    build: .
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      IQT02_DATABASE_PATH: /app/data/iqterra.sqlite3
      IQT02_UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data:/app/data
